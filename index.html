<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>비행기 전쟁 게임</title>
  <style>
    :root{
      --text:#eef6ff;
      --sub:#b7cae4;
      --gold:#ffd86f;
      --shadow:0 14px 40px rgba(0,0,0,.35);
      --green1:#003f14;
      --green2:#005b1d;
      --active:#ffe67d;
    }
    *{box-sizing:border-box;}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#050b12;
      color:var(--text);
      font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
      -webkit-user-select:none;
      user-select:none;
      touch-action:none;
    }
    button,input{font-family:inherit;}
    #app{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 110%, rgba(255,120,70,.12), transparent 28%),
        linear-gradient(180deg,#0c1019 0%,#131a28 45%,#0b1019 100%);
    }
    .screen{position:absolute; inset:0; display:none;}
    .screen.active{display:block;}
    .center-wrap{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .war-bg::before,.war-bg::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .war-bg::before{
      background:
        linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.52)),
        radial-gradient(circle at 18% 20%, rgba(255,150,90,.08), transparent 18%),
        radial-gradient(circle at 80% 16%, rgba(255,80,80,.08), transparent 20%),
        linear-gradient(180deg,#0f141d 0%,#2a241d 35%,#171d2c 72%,#0a0f16 100%);
    }
    .war-bg::after{
      background:
        repeating-linear-gradient(120deg, rgba(255,255,255,.015) 0 2px, transparent 2px 24px),
        radial-gradient(circle at 15% 70%, rgba(255,120,70,.08), transparent 18%),
        radial-gradient(circle at 83% 74%, rgba(255,90,90,.05), transparent 14%);
      mix-blend-mode:screen;
      opacity:.85;
    }

    #loadingScreen{
      background:
        radial-gradient(circle at 50% 90%, rgba(0,255,255,.07), transparent 18%),
        radial-gradient(circle at 20% 20%, rgba(111,153,255,.08), transparent 18%),
        radial-gradient(circle at 80% 18%, rgba(0,214,255,.06), transparent 18%),
        linear-gradient(180deg,#060b14 0%,#0b1220 45%,#060a13 100%);
      overflow:hidden;
    }
    #loadingScreen::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 25% 30%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 42% 18%, rgba(255,255,255,.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 58% 26%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 73% 12%, rgba(255,255,255,.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 87% 22%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 68%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 36% 74%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 62% 64%, rgba(255,255,255,.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 81% 78%, rgba(255,255,255,.7) 0 1px, transparent 1.5px);
      opacity:.55;
      pointer-events:none;
    }
    #loadingScreen::after{
      content:"";
      position:absolute;
      inset:-20%;
      background:
        linear-gradient(90deg, transparent 0%, rgba(0,200,255,.05) 45%, rgba(0,200,255,.14) 50%, rgba(0,200,255,.05) 55%, transparent 100%);
      transform:skewY(-8deg);
      animation:scanMove 3s linear infinite;
      pointer-events:none;
    }
    @keyframes scanMove{
      0%{transform:translateX(-25%) skewY(-8deg);}
      100%{transform:translateX(25%) skewY(-8deg);}
    }
    .loading-card{
      width:min(92vw,760px);
      padding:28px;
      border-radius:28px;
      background:linear-gradient(180deg,rgba(9,16,28,.86),rgba(6,10,18,.9));
      border:1px solid rgba(130,190,255,.18);
      box-shadow:0 0 0 1px rgba(80,160,255,.08), 0 18px 50px rgba(0,0,0,.5);
      text-align:center;
      backdrop-filter:blur(8px);
      position:relative;
      z-index:2;
    }
    .loading-title{
      font-size:clamp(36px,7vw,64px);
      font-weight:900;
      margin-bottom:12px;
      letter-spacing:2px;
      text-shadow:0 0 18px rgba(120,220,255,.22);
    }
    .loading-sub{
      color:#dbe6ff;
      margin-bottom:20px;
      font-size:15px;
    }
    .loading-deco{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:20px;
      margin-bottom:16px;
      opacity:.95;
    }
    .loading-ship{
      width:78px;
      height:56px;
      filter:drop-shadow(0 0 10px rgba(120,220,255,.22));
      animation:loadingShipFloat 1.6s ease-in-out infinite;
    }
    .loading-bullets{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .loading-bullet{
      width:10px;
      height:28px;
      border-radius:8px;
      background:linear-gradient(180deg,#6ce4ff,#ffffff);
      box-shadow:0 0 12px rgba(120,240,255,.35);
      animation:bulletPulse 1.0s ease-in-out infinite;
    }
    .loading-bullet:nth-child(2){animation-delay:.12s;}
    .loading-bullet:nth-child(3){animation-delay:.24s;}
    .loading-bullet:nth-child(4){animation-delay:.36s;}
    @keyframes loadingShipFloat{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-6px);}
    }
    @keyframes bulletPulse{
      0%,100%{transform:translateY(0); opacity:.7;}
      50%{transform:translateY(-5px); opacity:1;}
    }
    .loading-bar{
      width:100%;
      height:26px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(130,190,255,.18);
      overflow:hidden;
      box-shadow:inset 0 2px 8px rgba(0,0,0,.35), 0 0 24px rgba(70,170,255,.08);
    }
    .loading-fill{
      width:0%;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#4aa8ff,#7cf8ff,#bfeeff);
      box-shadow:0 0 18px rgba(120,240,255,.35);
    }
    .loading-text{
      margin-top:12px;
      font-size:18px;
      font-weight:900;
      color:#e6f7ff;
    }

    .topbar{
      position:absolute;
      top:14px;
      left:14px;
      right:14px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      z-index:6;
      flex-wrap:wrap;
    }
    .topbar-left,.topbar-right{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .chip{
      background:rgba(15,19,32,.78);
      border:1px solid rgba(255,255,255,.1);
      border-radius:999px;
      padding:10px 14px;
      color:#eaf1ff;
      font-weight:800;
      backdrop-filter:blur(8px);
      box-shadow:var(--shadow);
    }
    .btn{
      border:none;
      border-radius:16px;
      height:52px;
      padding:0 18px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      color:#fff;
      background:linear-gradient(180deg,#3d6dff,#2245ab);
      box-shadow:0 8px 20px rgba(34,69,171,.35);
    }
    .btn.secondary{
      background:linear-gradient(180deg,#4d556d,#2a3041);
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }

    .opening-overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:18px;
      pointer-events:none;
    }
    .opening-title{
      font-size:clamp(34px,7vw,66px);
      font-weight:900;
      letter-spacing:2px;
      text-shadow:0 0 25px rgba(255,180,120,.2),0 8px 30px rgba(0,0,0,.4);
    }
    .opening-plane{
      width:min(60vw,320px);
      aspect-ratio:1.3/1;
      filter:drop-shadow(0 14px 30px rgba(0,0,0,.55));
      animation:openingFloat 2.6s ease-in-out infinite;
    }
    @keyframes openingFloat{
      0%,100%{transform:translateY(0) rotate(-1deg);}
      50%{transform:translateY(-10px) rotate(1deg);}
    }
    .nickname-card{
      width:min(92vw,520px);
      background:linear-gradient(180deg,rgba(18,24,40,.96),rgba(10,14,24,.96));
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:24px;
      backdrop-filter:blur(8px);
      position:relative;
      z-index:2;
    }
    .nickname-card h1{
      margin:0 0 8px;
      font-size:clamp(28px,6vw,42px);
    }
    .nickname-card .sub{
      color:var(--sub);
      line-height:1.6;
      margin-bottom:18px;
      font-size:14px;
    }
    .field{margin-bottom:14px;}
    .field label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:800;
      color:#dce8ff;
    }
    .field input{
      width:100%;
      height:52px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.14);
      outline:none;
      padding:0 16px;
      font-size:16px;
      background:rgba(255,255,255,.06);
      color:#fff;
    }
    .hint{
      min-height:22px;
      margin-top:8px;
      font-size:13px;
      color:var(--sub);
    }
    .hint.ok{color:#8bffb3;}
    .hint.bad{color:#ff9c9c;}
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .left-menu{
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      z-index:5;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .menu-btn{
      min-width:128px;
      height:56px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(180deg,rgba(40,48,70,.96),rgba(18,22,34,.96));
      color:#fff;
      font-size:18px;
      font-weight:900;
      box-shadow:var(--shadow);
      cursor:pointer;
    }
    .main-layout{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:90px 18px 100px;
      z-index:2;
    }
    .hero-plane{
      width:min(72vw,420px);
      aspect-ratio:1.4/1;
      position:relative;
      filter:drop-shadow(0 18px 40px rgba(0,0,0,.5));
      cursor:pointer;
    }
    .play-btn-wrap{
      position:absolute;
      left:0;
      right:0;
      bottom:18px;
      display:flex;
      justify-content:center;
      gap:14px;
      z-index:4;
      padding:0 16px;
      flex-wrap:wrap;
    }
    .play-btn,.stage-btn,.bossmap-btn{
      width:min(42vw,280px);
      min-width:220px;
      height:68px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.12);
      font-size:clamp(22px,4.8vw,30px);
      font-weight:900;
      letter-spacing:1px;
      cursor:pointer;
    }
    .play-btn{
      color:#2c1800;
      background:linear-gradient(180deg,#ffe696,#d4971e);
      box-shadow:0 14px 30px rgba(212,151,30,.35);
    }
    .stage-btn{
      color:#fff;
      background:linear-gradient(180deg,#4c8eff,#2647b5);
      box-shadow:0 14px 30px rgba(38,71,181,.35);
    }
    .bossmap-btn{
      color:#fff;
      background:linear-gradient(180deg,#8c5bff,#5220c7);
      box-shadow:0 14px 30px rgba(82,32,199,.35);
    }

    #planeScreen{
      background:linear-gradient(90deg,var(--green1),var(--green2));
      overflow:hidden;
    }
    .panel-top{
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:110px;
      padding:18px 28px;
      z-index:4;
      background:linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0));
    }
    .panel-title{
      font-size:78px;
      font-weight:900;
      line-height:1;
      margin:0;
      color:#f2f2f2;
      letter-spacing:1px;
    }
    .panel-back{
      position:absolute;
      top:20px;
      right:22px;
      width:58px;
      height:58px;
      border:none;
      border-radius:18px;
      background:linear-gradient(180deg,#55617b,#2c3344);
      color:#fff;
      font-size:28px;
      font-weight:900;
      cursor:pointer;
      box-shadow:var(--shadow);
    }
    .plane-scroll{
      position:absolute;
      inset:120px 0 0 0;
      overflow-y:auto;
      padding:8px 28px 40px;
      -webkit-overflow-scrolling:touch;
    }
    .tab-row{
      display:flex;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }
    .tab-btn{
      min-width:120px;
      height:52px;
      padding:0 16px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
    }
    .tab-btn.active{
      background:#fff200;
      color:#111;
    }
    .card-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(240px, 1fr));
      gap:26px 22px;
      align-items:start;
    }
    .item-card{
      min-height:340px;
      border-radius:30px;
      border:6px solid rgba(235,235,235,.78);
      background:rgba(0,70,18,.12);
      position:relative;
      padding:20px;
      color:#fff;
      cursor:pointer;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .item-card.selected{
      transform:scale(1.03);
      box-shadow:0 18px 35px rgba(0,0,0,.28);
      background:rgba(0,55,14,.22);
      border-color:#ffe77e;
    }
    .item-card.locked{
      filter:grayscale(.35);
      opacity:.9;
    }
    .item-rank{
      position:absolute;
      top:12px;
      right:16px;
      font-size:24px;
      font-weight:900;
      color:#fff;
    }
    .item-preview{
      width:170px;
      height:170px;
      margin:18px auto 8px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .item-name{
      text-align:center;
      font-size:30px;
      font-weight:900;
      margin-top:4px;
      color:#fff;
    }
    .item-stats{
      display:none;
      margin-top:14px;
      text-align:center;
      color:#ebf4ff;
      line-height:1.7;
      font-size:18px;
      font-weight:800;
      white-space:pre-line;
    }
    .item-card.selected .item-stats{display:block;}
    .selected-badge{
      display:none;
      margin:10px auto 0;
      width:max-content;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,215,120,.14);
      border:1px solid rgba(255,215,120,.4);
      color:#fff2b5;
      font-weight:900;
      font-size:16px;
    }
    .item-card.selected .selected-badge{display:block;}
    .card-btn{
      display:none;
      margin:14px auto 0;
      width:min(100%,260px);
      height:56px;
      border:none;
      border-radius:18px;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
    }
    .item-card.selected .card-btn{display:block;}
    .select-btn{
      background:linear-gradient(180deg,#8cecff,#2eaee0);
      color:#04293a;
    }
    .upgrade-btn{
      background:linear-gradient(180deg,#ffe28f,#d79d20);
      color:#2a1a00;
    }
    .buy-btn{
      background:linear-gradient(180deg,#9ef0a7,#2b9a40);
      color:#05200b;
    }
    .disabled-btn{
      background:linear-gradient(180deg,#626a7a,#2d3340);
      color:#dbe5ff;
      cursor:not-allowed;
    }

    #stageScreen, #bossMapScreen{
      background:
        radial-gradient(circle at 50% 90%, rgba(86,148,255,.14), transparent 24%),
        linear-gradient(180deg,#09111b 0%, #121c2c 55%, #09111b 100%);
    }
    .stage-wrap{
      position:absolute;
      inset:0;
      padding:110px 24px 30px;
      overflow:auto;
    }
    .stage-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
      gap:18px;
    }
    .stage-card{
      background:linear-gradient(180deg, rgba(22,31,48,.95), rgba(11,16,26,.95));
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      padding:20px;
      box-shadow:var(--shadow);
      cursor:pointer;
    }
    .stage-card.selected{
      border-color:var(--active);
      box-shadow:0 0 0 2px rgba(255,230,125,.18), var(--shadow);
    }
    .stage-card.locked{
      filter:grayscale(.5);
      opacity:.65;
    }
    .stage-name{
      font-size:30px;
      font-weight:900;
      margin-bottom:6px;
    }
    .stage-desc{
      color:#c5d6ef;
      line-height:1.6;
      min-height:78px;
      white-space:pre-line;
    }
    .stage-select-btn{
      margin-top:14px;
      width:100%;
      height:54px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-size:20px;
      font-weight:900;
      color:#fff;
      background:linear-gradient(180deg,#3f7dff,#234db5);
    }
    .stage-select-btn.locked{
      background:linear-gradient(180deg,#626a7a,#2d3340);
      cursor:not-allowed;
    }

    .hud{
      position:absolute;
      top:12px;
      left:12px;
      right:12px;
      z-index:20;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      pointer-events:none;
    }
    .hud-left,.hud-right{
      display:flex;
      gap:10px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .hud-box{
      background:rgba(12,16,28,.78);
      border:1px solid rgba(255,255,255,.1);
      border-radius:18px;
      padding:10px 14px;
      backdrop-filter:blur(8px);
      box-shadow:var(--shadow);
    }
    .hud-title{
      font-size:12px;
      color:#9fb0d8;
      margin-bottom:3px;
    }
    .hud-main{
      font-size:18px;
      font-weight:900;
    }

    #gameCanvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      background:
        radial-gradient(circle at 50% 100%, rgba(255,110,60,.08), transparent 22%),
        linear-gradient(180deg,#161a22 0%,#1d2433 36%,#111722 100%);
      touch-action:none;
      cursor:crosshair;
    }
    .pause-tip{
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      z-index:25;
      background:rgba(0,0,0,.38);
      border:1px solid rgba(255,255,255,.09);
      border-radius:999px;
      padding:10px 16px;
      color:#dce8ff;
      font-weight:700;
      font-size:14px;
      backdrop-filter:blur(8px);
      pointer-events:none;
      text-align:center;
      white-space:pre-line;
    }

    .gameover-menu{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:40;
      background:rgba(0,0,0,.45);
      padding:20px;
    }
    .gameover-menu.show{display:flex;}
    .gameover-card{
      width:min(92vw,500px);
      border-radius:24px;
      background:linear-gradient(180deg, rgba(20,24,36,.96), rgba(10,12,20,.96));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:var(--shadow);
      padding:24px;
      text-align:center;
    }
    .gameover-title{
      font-size:clamp(30px,7vw,44px);
      font-weight:900;
      margin-bottom:10px;
      color:#fff3f3;
    }
    .gameover-sub{
      font-size:16px;
      color:#cfdcff;
      margin-bottom:12px;
      line-height:1.6;
      white-space:pre-line;
    }
    .revive-box{
      margin:10px 0 18px;
      border-radius:18px;
      padding:14px;
      background:rgba(255,215,106,.08);
      border:1px solid rgba(255,215,106,.22);
    }
    .revive-cost{
      color:#ffd86d;
      font-weight:900;
      font-size:18px;
      margin-bottom:10px;
    }
    .gameover-actions{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .go-btn{
      min-width:120px;
      height:56px;
      border:none;
      border-radius:18px;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      color:#fff;
    }
    .go-revive{
      background:linear-gradient(180deg,#ffdf87,#cb8b13);
      color:#2f1d00;
      box-shadow:0 10px 20px rgba(203,139,19,.35);
    }
    .go-restart{
      background:linear-gradient(180deg,#3f7dff,#234db5);
      box-shadow:0 10px 20px rgba(35,77,181,.35);
    }
    .go-exit{
      background:linear-gradient(180deg,#666f86,#31384a);
