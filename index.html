<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>비행기 전쟁 게임</title>
  <style>
    :root {
      --bg1: #0a0f1b;
      --bg2: #151b2e;
      --panel: rgba(18, 24, 40, 0.9);
      --panel2: rgba(28, 36, 58, 0.92);
      --line: rgba(255,255,255,0.12);
      --text: #eef4ff;
      --sub: #aab6d6;
      --accent: #8fc7ff;
      --danger: #ff6b6b;
      --gold: #ffd76a;
      --green: #8bffb3;
      --shadow: 0 12px 40px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      color: var(--text);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 120%, rgba(255,120,80,0.18), transparent 30%),
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.05), transparent 18%),
        radial-gradient(circle at 80% 15%, rgba(255,255,255,0.03), transparent 15%),
        linear-gradient(180deg, #0a0d16 0%, #141b2b 45%, #0c111d 100%);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
    }
    .screen.active {
      display: block;
    }

    .war-bg::before,
    .war-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .war-bg::before {
      background:
        linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.4)),
        radial-gradient(circle at 30% 20%, rgba(255,160,90,0.08), transparent 16%),
        radial-gradient(circle at 70% 14%, rgba(255,80,80,0.06), transparent 18%),
        linear-gradient(180deg, #161a24 0%, #26221f 35%, #1b1f2b 70%, #0f121b 100%);
    }
    .war-bg::after {
      background:
        repeating-linear-gradient(120deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 24px),
        radial-gradient(circle at 15% 65%, rgba(255,120,70,0.08), transparent 18%),
        radial-gradient(circle at 80% 75%, rgba(255,90,90,0.05), transparent 14%);
      mix-blend-mode: screen;
      opacity: 0.8;
    }

    .nickname-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2;
    }
    .nickname-card {
      width: min(92vw, 520px);
      background: linear-gradient(180deg, rgba(18,24,40,0.95), rgba(10,14,24,0.95));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 24px;
      backdrop-filter: blur(8px);
    }
    .nickname-card h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 6vw, 42px);
      letter-spacing: 1px;
    }
    .nickname-card .sub {
      color: var(--sub);
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d7e4ff;
      font-weight: 700;
    }
    .field input {
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      outline: none;
      padding: 0 16px;
      font-size: 16px;
      background: rgba(255,255,255,0.06);
      color: white;
    }
    .hint {
      min-height: 22px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--sub);
    }
    .hint.ok { color: var(--green); }
    .hint.bad { color: #ff9a9a; }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 16px;
      height: 52px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #3c6dff, #2245aa);
      box-shadow: 0 8px 20px rgba(34,69,170,0.35);
    }
    .btn.secondary {
      background: linear-gradient(180deg, #4d556d, #2a3041);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .btn.gold {
      color: #2c1a00;
      background: linear-gradient(180deg, #ffe28e, #d79c1b);
      box-shadow: 0 8px 20px rgba(215,156,27,0.35);
    }

    .opening-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      z-index: 1;
      pointer-events: none;
    }
    .opening-title {
      font-size: clamp(32px, 7vw, 64px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 25px rgba(255,180,120,0.2), 0 8px 30px rgba(0,0,0,0.4);
    }
    .opening-plane {
      position: relative;
      width: min(60vw, 320px);
      aspect-ratio: 1.3 / 1;
      filter: drop-shadow(0 14px 30px rgba(0,0,0,0.55));
      animation: openingFloat 2.6s ease-in-out infinite;
    }
    @keyframes openingFloat {
      0%,100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    .topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 6;
      gap: 10px;
    }
    .chip {
      background: rgba(15, 19, 32, 0.78);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 10px 14px;
      color: #eaf1ff;
      font-weight: 700;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .main-layout {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 90px 18px 100px;
      z-index: 2;
    }

    .left-menu {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .menu-btn {
      min-width: 128px;
      height: 56px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(40,48,70,0.95), rgba(18,22,34,0.95));
      color: white;
      font-size: 18px;
      font-weight: 800;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .hero-plane {
      width: min(72vw, 420px);
      aspect-ratio: 1.4 / 1;
      position: relative;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,0.5));
    }

    .play-btn-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      display: flex;
      justify-content: center;
      z-index: 4;
    }
    .play-btn {
      width: min(90vw, 360px);
      height: 68px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: clamp(24px, 5vw, 30px);
      font-weight: 900;
      letter-spacing: 1px;
      color: #2c1800;
      background: linear-gradient(180deg, #ffe696, #d4971e);
      box-shadow: 0 14px 30px rgba(212,151,30,0.35);
      cursor: pointer;
    }

    .plane-panel {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(0,0,0,0.48);
      padding: 20px;
    }
    .plane-panel.show { display: flex; }
    .plane-card-wrap {
      width: min(96vw, 780px);
      background: linear-gradient(180deg, rgba(20,24,36,0.96), rgba(10,12,20,0.96));
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .plane-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 12px;
    }
    .plane-panel-title {
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 900;
    }
    .close-btn {
      border: none;
      border-radius: 14px;
      width: 52px;
      height: 52px;
      font-size: 24px;
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #4d556d, #2a3041);
    }
    .plane-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }
    .plane-select-card {
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(34,42,64,0.95), rgba(17,22,35,0.95));
      padding: 20px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.24);
    }
    .plane-select-card.selected {
      transform: scale(1.04);
      border-color: rgba(255,214,110,0.8);
      box-shadow: 0 14px 32px rgba(255,214,110,0.12);
    }
    .plane-mini-view {
      width: 180px;
      aspect-ratio: 1.3 / 1;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.35));
    }
    .plane-name {
      font-size: 24px;
      font-weight: 900;
      margin-top: 4px;
    }
    .plane-desc {
      color: #d6e2ff;
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
      min-height: 78px;
    }
    .plane-stat {
      color: #ffd979;
      font-size: 18px;
      font-weight: 800;
    }
    .plane-upgrade-btn {
      margin-top: auto;
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      color: #2b1a00;
      background: linear-gradient(180deg, #ffe28f, #d49b1d);
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(12,16,28,0.78);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }
    .hud-title {
      font-size: 12px;
      color: #9fb0d8;
      margin-bottom: 3px;
    }
    .hud-main {
      font-size: 18px;
      font-weight: 900;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background:
        radial-gradient(circle at 50% 100%, rgba(255,110,60,0.08), transparent 22%),
        linear-gradient(180deg, #161a22 0%, #1d2433 36%, #111722 100%);
      touch-action: none;
    }

    .pause-tip {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 999px;
      padding: 10px 16px;
      color: #dce8ff;
      font-weight: 700;
      font-size: 14px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .gameover-menu {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      background: rgba(0,0,0,0.45);
      padding: 20px;
    }
    .gameover-menu.show {
      display: flex;
    }
    .gameover-card {
      width: min(92vw, 440px);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(20,24,36,0.96), rgba(10,12,20,0.96));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow);
      padding: 24px;
      text-align: center;
    }
    .gameover-title {
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 900;
      margin-bottom: 10px;
      color: #fff3f3;
    }
    .gameover-sub {
      font-size: 16px;
      color: #cfdcff;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .revive-box {
      margin: 10px 0 18px;
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,215,106,0.08);
      border: 1px solid rgba(255,215,106,0.22);
    }
    .revive-cost {
      color: #ffd86d;
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .gameover-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .go-btn {
      min-width: 120px;
      height: 56px;
      border: none;
      border-radius: 18px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      color: white;
    }
    .go-revive {
      background: linear-gradient(180deg, #ffdf87, #cb8b13);
      color: #2f1d00;
      box-shadow: 0 10px 20px rgba(203,139,19,0.35);
    }
    .go-restart {
      background: linear-gradient(180deg, #3f7dff, #234db5);
      box-shadow: 0 10px 20px rgba(35,77,181,0.35);
    }
    .go-exit {
      background: linear-gradient(180deg, #666f86, #31384a);
      box-shadow: 0 10px 20px rgba(0,0,0,0.28);
    }

    @media (max-width: 720px) {
      .left-menu {
        top: auto;
        bottom: 100px;
        left: 14px;
        transform: none;
      }
      .menu-btn {
        min-width: 108px;
        height: 50px;
        font-size: 16px;
      }
      .nickname-card {
        padding: 18px;
        border-radius: 20px;
      }
      .play-btn { height: 62px; }
      .go-btn {
        width: 100%;
        min-width: 0;
      }
      .plane-select-card.selected {
        transform: scale(1.02);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="nicknameScreen" class="screen active war-bg">
      <div class="opening-overlay">
        <div class="opening-plane" id="openingPlane"></div>
        <div class="opening-title">비행기 전쟁</div>
      </div>

      <div class="nickname-wrap">
        <div class="nickname-card">
          <h1>닉네임 설정</h1>
          <div class="sub">전쟁 속 출격 준비. 새 닉네임을 만들거나, 기존 닉네임으로 이어서 플레이하세요.</div>

          <div class="field">
            <label for="newNick">새 닉네임</label>
            <input id="newNick" maxlength="18" placeholder="새 닉네임 입력" />
            <div id="newNickHint" class="hint">사용 가능한 닉네임인지 확인해보세요.</div>
          </div>

          <div class="row" style="margin-bottom:18px;">
            <button id="startNewBtn" class="btn">시작</button>
          </div>

          <div class="field">
            <label for="loadNick">이미 사용중이신 닉네임이 있나요?</label>
            <input id="loadNick" maxlength="18" placeholder="기존 닉네임 입력" />
            <div id="loadNickHint" class="hint">저장된 닉네임으로 이어서 들어갈 수 있어요.</div>
          </div>

          <div class="row">
            <button id="loadBtn" class="btn secondary">들어가기</button>
          </div>
        </div>
      </div>
    </section>

    <section id="mainScreen" class="screen war-bg">
      <div class="topbar">
        <div class="chip">✈️ <span id="nickChip">파일럿</span></div>
        <div class="chip">🏅 골드 <span id="goldChip">0</span></div>
      </div>

      <div class="left-menu">
        <button id="planeTabBtn" class="menu-btn">비행기</button>
      </div>

      <div class="main-layout">
        <div class="hero-plane" id="heroPlane"></div>
      </div>

      <div class="play-btn-wrap">
        <button id="playBtn" class="play-btn">PLAY!</button>
      </div>

      <div id="planePanel" class="plane-panel">
        <div class="plane-card-wrap">
          <div class="plane-panel-head">
            <div class="plane-panel-title">비행기</div>
            <button id="closePlanePanelBtn" class="close-btn">×</button>
          </div>

          <div class="plane-grid">
            <div id="basicPlaneCard" class="plane-select-card selected">
              <div class="plane-mini-view" id="basicPlaneView"></div>
              <div class="plane-name">기본 비행기</div>
              <div class="plane-desc">
                균형 잡힌 기본 기체.<br>
                안정적인 레이저 공격을 사용한다.
              </div>
              <div class="plane-stat">공격력: <span id="planeAttackText">100</span></div>
              <button id="upgradePlaneBtn" class="plane-upgrade-btn">강화: 100골드</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="battleScreen" class="screen">
      <canvas id="gameCanvas"></canvas>

      <div class="hud">
        <div class="hud-box">
          <div class="hud-title">파일럿</div>
          <div class="hud-main" id="hudNick">-</div>
        </div>
        <div class="hud-box">
          <div class="hud-title">골드</div>
          <div class="hud-main" id="hudGold">0</div>
        </div>
        <div class="hud-box" style="text-align:right;">
          <div class="hud-title">상태</div>
          <div class="hud-main" id="hudState">대기 중</div>
        </div>
      </div>

      <div class="pause-tip">화면을 누르고 드래그하면 시간이 흐릅니다. 떼면 즉시 멈춥니다.</div>

      <div id="gameoverMenu" class="gameover-menu">
        <div class="gameover-card">
          <div class="gameover-title">GAME OVER</div>
          <div id="gameoverInfo" class="gameover-sub">최종 기록</div>
          <div class="revive-box">
            <div id="reviveCostText" class="revive-cost">부활 비용: 50골드</div>
            <div id="earnedGoldText" class="gameover-sub" style="margin:0;">획득 골드: 0</div>
          </div>
          <div class="gameover-actions">
            <button id="reviveBtn" class="go-btn go-revive">부활</button>
            <button id="restartBtn" class="go-btn go-restart">다시시작</button>
            <button id="exitBtn" class="go-btn go-exit">나가기</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY_PREFIX = "air_war_save_v2_";

    const nicknameScreen = document.getElementById("nicknameScreen");
    const mainScreen = document.getElementById("mainScreen");
    const battleScreen = document.getElementById("battleScreen");
    const newNick = document.getElementById("newNick");
    const loadNick = document.getElementById("loadNick");
    const newNickHint = document.getElementById("newNickHint");
    const loadNickHint = document.getElementById("loadNickHint");
    const startNewBtn = document.getElementById("startNewBtn");
    const loadBtn = document.getElementById("loadBtn");
    const nickChip = document.getElementById("nickChip");
    const goldChip = document.getElementById("goldChip");
    const hudNick = document.getElementById("hudNick");
    const hudGold = document.getElementById("hudGold");
    const hudState = document.getElementById("hudState");
    const playBtn = document.getElementById("playBtn");
    const openingPlane = document.getElementById("openingPlane");
    const heroPlane = document.getElementById("heroPlane");

    const planeTabBtn = document.getElementById("planeTabBtn");
    const planePanel = document.getElementById("planePanel");
    const closePlanePanelBtn = document.getElementById("closePlanePanelBtn");
    const basicPlaneCard = document.getElementById("basicPlaneCard");
    const basicPlaneView = document.getElementById("basicPlaneView");
    const planeAttackText = document.getElementById("planeAttackText");
    const upgradePlaneBtn = document.getElementById("upgradePlaneBtn");

    const gameoverMenu = document.getElementById("gameoverMenu");
    const gameoverInfo = document.getElementById("gameoverInfo");
    const reviveCostText = document.getElementById("reviveCostText");
    const earnedGoldText = document.getElementById("earnedGoldText");
    const reviveBtn = document.getElementById("reviveBtn");
    const restartBtn = document.getElementById("restartBtn");
    const exitBtn = document.getElementById("exitBtn");

    function showScreen(el) {
      [nicknameScreen, mainScreen, battleScreen].forEach(s => s.classList.remove("active"));
      el.classList.add("active");
    }

    function saveExists(nick) {
      return !!localStorage.getItem(STORAGE_KEY_PREFIX + nick.trim());
    }

    function savePlayer(data) {
      localStorage.setItem(STORAGE_KEY_PREFIX + data.nickname, JSON.stringify(data));
    }

    function loadPlayer(nick) {
      const raw = localStorage.getItem(STORAGE_KEY_PREFIX + nick.trim());
      return raw ? JSON.parse(raw) : null;
    }

    function baseSave(nickname) {
      return {
        nickname,
        bestWave: 1,
        gold: 0,
        planeAttackBase: 100,
        planeUpgradeLevel: 0,
        createdAt: Date.now()
      };
    }

    function updateGoldUI() {
      const gold = playerProfile?.gold || 0;
      goldChip.textContent = gold;

          <path d="M ${s*0.1} ${s*0.36} C ${s*0.18} ${s*0.18}, ${s*0.32} ${s*0.14}, ${s*0.58} ${s*0.22} C ${s*0.72} ${s*0.26}, ${s*0.82} ${s*0.31}, ${s*0.91} ${s*0.35} C ${s*0.82} ${s*0.42}, ${s*0.73} ${s*0.47}, ${s*0.58} ${s*0.5} C ${s*0.31} ${s*0.55}, ${s*0.18} ${s*0.49}, ${s*0.1} ${s*0.36}Z" fill="${body}" stroke="#2d3447" stroke-width="${small ? 4 : 5}"/>
          <path d="M ${s*0.34} ${s*0.32} L ${s*0.53} ${s*0.14} L ${s*0.59} ${s*0.15} L ${s*0.5} ${s*0.33} Z" fill="${wing}" stroke="#2d3447" stroke-width="${small ? 3 : 4}"/>
          <path d="M ${s*0.34} ${s*0.41} L ${s*0.55} ${s*0.58} L ${s*0.61} ${s*0.56} L ${s*0.5} ${s*0.4} Z" fill="${wing}" stroke="#2d3447" stroke-width="${small ? 3 : 4}"/>
          <path d="M ${s*0.72} ${s*0.26} L ${s*0.79} ${s*0.09} L ${s*0.85} ${s*0.1} L ${s*0.8} ${s*0.29} Z" fill="${wing}" stroke="#2d3447" stroke-width="${small ? 3 : 4}"/>
          <rect x="${s*0.2}" y="${s*0.31}" width="${s*0.06}" height="${s*0.1}" rx="16" fill="${glass}" stroke="#294d79" stroke-width="${small ? 2 : 3}"/>

    }

    openingPlane.innerHTML = planeSVG({ propFast: true, glow: true });
    heroPlane.innerHTML = planeSVG({ propFast: true, glow: true });
    basicPlaneView.innerHTML = planeSVG({ propFast: true, glow: true, small: true });

    planeTabBtn.addEventListener("click", () => {
      planePanel.classList.add("show");
      basicPlaneCard.classList.add("selected");
    });

    closePlanePanelBtn.addEventListener("click", () => {
      planePanel.classList.remove("show");
    });

    basicPlaneCard.addEventListener("click", () => {
      basicPlaneCard.classList.add("selected");
    });

    upgradePlaneBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!playerProfile) return;
      if ((playerProfile.gold || 0) < 100) {
        alert("골드가 부족해.");
        return;
      }
      playerProfile.gold -= 100;
      playerProfile.planeUpgradeLevel = (playerProfile.planeUpgradeLevel || 0) + 1;
      playerProfile.planeAttackBase += 18;
      savePlayer(playerProfile);
      updateGoldUI();
      updatePlaneUI();
    });

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let W = 0;
    let H = 0;

    function resize() {
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const REVIVE_COSTS = [50, 70, 100, 150, 170];

    const game = {
      running: false,
      touchDown: false,
      pointerId: null,
      targetX: 0,
      targetY: 0,
      phase: "idle",
      holdTime: 0,
      time: 0,
      wave: 0,
      score: 0,
      nextWaveDelay: 0,
      message: "",
      messageTimer: 0,
      shake: 0,
      stars: [],
      particles: [],
      enemyBullets: [],
      bullets: [],
      lasers: [],
      enemies: [],
      items: [],
      boss: null,
      player: null,
      waveSpawned: false,
      playerName: "파일럿",
      reviveCount: 0,
      earnedGold: 0,
      hitFlash: 0
    };

    function getReviveCost() {
      if (game.reviveCount < REVIVE_COSTS.length) return REVIVE_COSTS[game.reviveCount];
      return 170 + (game.reviveCount - 4) * 20;
    }

    function hideGameoverMenu() {
      gameoverMenu.classList.remove("show");
    }

    function showGameoverMenu() {
      game.earnedGold = Math.round(game.score * 0.1);
      gameoverInfo.textContent = `최종 WAVE ${game.wave} · 점수 ${game.score}`;
      reviveCostText.textContent = `부활 비용: ${getReviveCost()}골드`;
      earnedGoldText.textContent = `획득 골드: ${game.earnedGold}`;
      reviveBtn.disabled = (playerProfile.gold || 0) < getReviveCost();
      reviveBtn.style.opacity = reviveBtn.disabled ? "0.55" : "1";
      gameoverMenu.classList.add("show");
    }

    function grantRunGold() {
      if (!playerProfile) return;
      const amount = Math.round(game.score * 0.1);
      playerProfile.gold = (playerProfile.gold || 0) + amount;
      savePlayer(playerProfile);
      updateGoldUI();
      game.earnedGold = amount;
    }

    function resetBattle() {
      game.running = true;
      game.touchDown = false;
      game.pointerId = null;
      game.phase = "prestart";
      game.holdTime = 0;
      game.time = 0;
      game.wave = 0;
      game.score = 0;
      game.nextWaveDelay = 0;
      game.message = "눌러서 출격 준비";
      game.messageTimer = 99999;
      game.shake = 0;
      game.hitFlash = 0;
      game.stars = [];
      game.particles = [];
      game.enemyBullets = [];
      game.bullets = [];
      game.lasers = [];
      game.enemies = [];
      game.items = [];
      game.boss = null;
      game.waveSpawned = false;
      game.reviveCount = 0;
      game.earnedGold = 0;
      game.player = {
        x: W * 0.5,
        y: H + 120,
        w: 60,
        h: 64,
        hp: 1,
        alive: true,
        level: 1,
        dmg: Math.max(1, Math.round((playerProfile?.planeAttackBase || 100) / 100)),
        laserPower: playerProfile?.planeAttackBase || 100,
        bulletCount: 1,
        powerStacks: 0,
        miniLevel: 0,
        miniBulletCount: 0,
        maxNormalLevel: 15,
        shotCooldown: 0,
        entryDone: false,
        invincible: 0
      };
      game.targetX = game.player.x;
      game.targetY = H - 120;
      game.playerName = playerProfile ? playerProfile.nickname : "파일럿";
      hudState.textContent = "대기 중";
      hudNick.textContent = game.playerName;
      updateGoldUI();
      hideGameoverMenu();

      for (let i = 0; i < 70; i++) {
        game.stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.8 + 0.4,
          s: Math.random() * 10 + 8,
          a: Math.random() * 0.45 + 0.15
        });
      }
    }

    playBtn.addEventListener("click", () => {
      showScreen(battleScreen);
      resetBattle();
    });

    restartBtn.addEventListener("click", () => {
      grantRunGold();
      resetBattle();
    });

    exitBtn.addEventListener("click", () => {
      grantRunGold();
      game.running = false;
      hideGameoverMenu();
      enterMain();
    });

    reviveBtn.addEventListener("click", () => {
      const cost = getReviveCost();
      if ((playerProfile.gold || 0) < cost) return;
      playerProfile.gold -= cost;
      savePlayer(playerProfile);
      updateGoldUI();

      game.reviveCount += 1;
      game.player.alive = true;
      game.player.hp = 1;
      game.player.invincible = 2.0;
      game.player.x = W * 0.5;
      game.player.y = H - 100;
      game.enemyBullets = [];
      game.hitFlash = 0;
      game.shake = 0;
      hideGameoverMenu();
      showMessage("부활!", 1.0);
      hudState.textContent = `WAVE ${game.wave}`;
    });

    function canvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0) - rect.left,
        y: (e.clientY ?? (e.touches && e.touches[0]?.clientY) ?? 0) - rect.top
      };
    }

    function startTouch(e) {
      if (!game.running || !game.player?.alive) return;
      game.touchDown = true;
      if (e.pointerId != null) game.pointerId = e.pointerId;
      const p = canvasPos(e);
      game.targetX = p.x;
      game.targetY = p.y;
    }

    function moveTouch(e) {
      if (!game.touchDown) return;
      if (game.pointerId != null && e.pointerId != null && game.pointerId !== e.pointerId) return;
      const p = canvasPos(e);
      game.targetX = p.x;
      game.targetY = p.y;
    }

    function endTouch(e) {
      if (game.pointerId != null && e.pointerId != null && game.pointerId !== e.pointerId) return;
      game.touchDown = false;
      game.pointerId = null;
    }

    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture?.(e.pointerId);
      startTouch(e);
    });
    canvas.addEventListener("pointermove", moveTouch);
    canvas.addEventListener("pointerup", endTouch);
    canvas.addEventListener("pointercancel", endTouch);

    function rand(a, b) { return Math.random() * (b - a) + a; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function showMessage(msg, t = 1.2) {
      game.message = msg;
      game.messageTimer = t;
    }

    function spawnWave(wave) {
      game.waveSpawned = true;
      game.enemies = [];
      game.enemyBullets = [];
      game.items = [];
      game.boss = null;

      const isBoss = wave % 10 === 0;
      if (isBoss) {
        spawnBoss(wave);
        showMessage(`BOSS WAVE ${wave}!`, 1.8);
        hudState.textContent = `보스 WAVE ${wave}`;
        return;
      }

      showMessage(`WAVE ${wave}!`, 1.35);
      hudState.textContent = `WAVE ${wave}`;

      const rows = Math.min(2 + Math.floor(wave / 5), 5);
      const cols = Math.min(4 + Math.floor(wave * 0.45), 9);
      const hpBase = 2 + Math.floor(wave * 1.1);
      const dmg = 1 + Math.floor(wave / 8);
      const fireRate = Math.max(1.6, 3.2 - wave * 0.04);

      const startX = W * 0.16;
      const endX = W * 0.84;
      const gapX = cols > 1 ? (endX - startX) / (cols - 1) : 0;
      const topY = 100;
      const gapY = 72;

      let idx = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const tx = startX + c * gapX;
          const ty = topY + r * gapY;
          const pattern = ["sway", "zigzag", "dip", "curve"][Math.floor(Math.random() * 4)];
          game.enemies.push({
            id: idx++,
            x: tx + rand(-200, 200),
            y: -80 - r * 40 - Math.random() * 120,
            tx,
            ty,
            w: 34,
            h: 30,
            hp: hpBase + Math.floor(r * 0.8) + Math.floor(wave * 0.25),
            maxHp: hpBase + Math.floor(r * 0.8) + Math.floor(wave * 0.25),
            dmg,
            fireCooldown: rand(1.2, fireRate + 1.6),
            fireBase: fireRate,
            pattern,
            t: Math.random() * 6,
            phase: "enter"
          });
        }
      }
    }

    function spawnBoss(wave) {
      const hp = 220 + wave * 70;
      game.boss = {
        x: W * 0.5,
        y: -140,
        tx: W * 0.5,
        ty: 150,
        w: 160,
        h: 110,
        hp,
        maxHp: hp,
        dmg: 1 + Math.floor(wave / 10),
        phase: "enter",
        t: 0,
        fireCooldown: 1.4,
        volleyCooldown: 3.3,
        ringCooldown: 5.8,
        summonCooldown: 7.2,
        wave
      };
    }

    function spawnLaserSegment(x, y, width, height, dmg, colorMain = "#79d8ff", colorCore = "#ffffff") {
      game.lasers.push({
        x, y, width, height, dmg,
        colorMain, colorCore,
        life: 0.08,
        maxLife: 0.08
      });
    }

    function firePlayerBullets() {
      const p = game.player;
      const n = p.bulletCount;
      const spread = Math.min(24, 10 + (n - 1) * 3.2);

      for (let i = 0; i < n; i++) {
        const off = n === 1 ? 0 : ((i / (n - 1)) - 0.5) * spread * (n - 1);
        game.bullets.push({
          x: p.x + off,
          y: p.y - 28,
          vx: 0,
          vy: -760,
          width: 12,
          height: 34,
          dmg: p.dmg,
          colorMain: "#66d5ff",
          colorCore: "#ffffff",
          kind: "laser"
        });
      }

      if (p.miniLevel > 0) {
        const sideOffsets = [-30, 30];
        for (let m = 0; m < 2; m++) {
          const baseX = p.x + sideOffsets[m];
          const bn = Math.max(1, p.miniBulletCount);
          const sp = 10 + (bn - 1) * 3;
          for (let i = 0; i < bn; i++) {
            const off = bn === 1 ? 0 : ((i / (bn - 1)) - 0.5) * sp * (bn - 1);
            game.bullets.push({
              x: baseX + off,
              y: p.y - 14,
              vx: 0,
              vy: -650,
              width: 8,
              height: 24,
              dmg: Math.max(1, Math.floor(p.dmg * 0.45)),
              colorMain: "#94e2ff",
              colorCore: "#ffffff",
              kind: "laser-mini"
            });
          }
        }
      }
    }

    function explodeAt(x, y, power = 1) {
      const count = Math.floor(18 * power);
      for (let i = 0; i < count; i++) {
        game.particles.push({
          x,
          y,
          vx: rand(-180, 180) * power,
          vy: rand(-180, 180) * power,
          life: rand(0.35, 1.0),
          maxLife: 1.0,
          color: i % 3 === 0 ? "#ffd76a" : i % 3 === 1 ? "#ff8f6a" : "#ffffff",
          size: rand(2, 7)
        });
      }
    }

    function killEnemy(enemy) {
      const idx = game.enemies.indexOf(enemy);
      if (idx >= 0) game.enemies.splice(idx, 1);
      game.score += 10;
      explodeAt(enemy.x, enemy.y, 0.9);

      const r = Math.random();
      if (r < 0.01) {
        game.items.push({ x: enemy.x, y: enemy.y, vy: 55, type: "super", r: 14 });
      } else if (r < 0.04) {
        game.items.push({ x: enemy.x, y: enemy.y, vy: 60, type: "upgrade", r: 12 });
      } else if (r < 0.14) {
        game.items.push({ x: enemy.x, y: enemy.y, vy: 65, type: "power", r: 10 });
      }
    }

    function applyItem(type) {
      const p = game.player;
      if (type === "power") {
        if (p.level < p.maxNormalLevel) p.level += 1;
        p.powerStacks += 1;
        p.dmg += 1;
        p.laserPower += 18;
        if (p.powerStacks >= 3) {
          p.powerStacks = 0;
          if (p.bulletCount < 5) p.bulletCount += 1;
        }
        showMessage("POWER UP!", 0.8);
      } else if (type === "upgrade") {
        p.miniLevel += 1;
        if (p.miniLevel === 1) {
          p.miniBulletCount = 1;
          showMessage("보조 비행선 장착!", 1.1);
        } else {
          p.miniBulletCount = Math.min(3, p.miniBulletCount + 1);
          showMessage("보조 비행선 강화!", 1.1);
        }
      } else if (type === "super") {
        p.level = 16;
        p.bulletCount = 5;
        p.dmg = Math.max(p.dmg, 16);
        p.laserPower = Math.max(p.laserPower, 320);
        p.powerStacks = 0;
        p.miniLevel = Math.max(p.miniLevel, 2);
        p.miniBulletCount = Math.max(p.miniBulletCount, 2);
        showMessage("SUPER!! MAX LEVEL", 1.5);
      }
    }
    function playerHit(contactDeath = false) {
      if (!game.player.alive) return;
      if (game.player.invincible > 0) return;

      game.player.hp -= 1;
      game.shake = 0.55;
      game.hitFlash = 0.18;
      explodeAt(game.player.x, game.player.y, contactDeath ? 1.35 : 1.0);

      if (game.player.hp <= 0) {
        game.player.alive = false;
        hudState.textContent = "격추됨";
        showMessage(contactDeath ? "충돌 폭파!" : "GAME OVER", 99999);

        if (playerProfile) {
          playerProfile.bestWave = Math.max(playerProfile.bestWave || 1, game.wave);
          savePlayer(playerProfile);
        }

        showGameoverMenu();
      }
    }

    function rectCircleHit(cx, cy, cr, rx, ry, rw, rh) {
      const nx = clamp(cx, rx - rw / 2, rx + rw / 2);
      const ny = clamp(cy, ry - rh / 2, ry + rh / 2);
      const dx = cx - nx;
      const dy = cy - ny;
      return dx * dx + dy * dy <= cr * cr;
    }

    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return (
        Math.abs(ax - bx) * 2 < aw + bw &&
        Math.abs(ay - by) * 2 < ah + bh
      );
    }

    function laserHitsTarget(b, tx, ty, tw, th) {
      return rectsOverlap(b.x, b.y, b.width, b.height, tx, ty, tw, th);
    }

    function update(dt, activeDt) {
      if (!game.running) return;

      for (const s of game.stars) {
        s.y += s.s * activeDt;
        if (s.y > H + 4) {
          s.y = -4;
          s.x = Math.random() * W;
        }
      }

      if (game.messageTimer > 0) game.messageTimer -= activeDt || dt;
      if (game.shake > 0) game.shake -= dt;
      if (game.hitFlash > 0) game.hitFlash -= dt;

      const p = game.player;
      if (!p) return;

      if (p.invincible > 0) p.invincible -= dt;

      if (!p.entryDone) {
        p.y += (H - 110 - p.y) * Math.min(1, dt * 2.5);
        if (Math.abs((H - 110) - p.y) < 1.5) {
          p.y = H - 110;
          p.entryDone = true;
        }
      }

      if (game.touchDown && p.alive) {
        p.x += (game.targetX - p.x) * Math.min(1, activeDt * 12);
        p.y += (game.targetY - p.y) * Math.min(1, activeDt * 12);
      }

      p.x = clamp(p.x, 34, W - 34);
      p.y = clamp(p.y, 36, H - 60);

      if (!game.touchDown) {
        hudState.textContent = p.alive ? (game.phase === "battle" ? `WAVE ${game.wave} 정지` : "대기 중") : "격추됨";
        return;
      }

      game.time += activeDt;

      if (game.phase === "prestart") {
        game.holdTime += activeDt;
        hudState.textContent = "출격 중...";
        if (game.holdTime >= 1.5) {
          game.phase = "battle";
          game.wave = 1;
          game.waveSpawned = false;
        }
      }

      if (game.phase === "battle" && p.alive) {
        if (!game.waveSpawned) spawnWave(game.wave);

        p.shotCooldown -= activeDt;
        if (p.shotCooldown <= 0) {
          firePlayerBullets();
          p.shotCooldown = Math.max(0.08, 0.24 - Math.min(0.11, p.level * 0.008));
        }

        for (let i = game.bullets.length - 1; i >= 0; i--) {
          const b = game.bullets[i];
          b.x += b.vx * activeDt;
          b.y += b.vy * activeDt;

          if (b.y < -60 || b.x < -40 || b.x > W + 40) {
            game.bullets.splice(i, 1);
            continue;
          }

          spawnLaserSegment(
            b.x,
            b.y + b.height * 0.1,
            b.width,
            b.height,
            b.dmg,
            b.colorMain,
            b.colorCore
          );

          let hit = false;

          if (game.boss) {
            const boss = game.boss;
            if (laserHitsTarget(b, boss.x, boss.y, boss.w, boss.h)) {
              boss.hp -= b.dmg;
              game.bullets.splice(i, 1);
              hit = true;

              if (boss.hp <= 0) {
                explodeAt(boss.x, boss.y, 2.2);
                game.score += 400;
                game.boss = null;
                game.nextWaveDelay = 1.8;
                showMessage("BOSS DOWN!", 1.6);
              }
            }
          }
          if (hit) continue;

          for (let j = game.enemies.length - 1; j >= 0; j--) {
            const e = game.enemies[j];
            if (laserHitsTarget(b, e.x, e.y, e.w, e.h)) {
              e.hp -= b.dmg;
              game.bullets.splice(i, 1);
              if (e.hp <= 0) killEnemy(e);
              break;
            }
          }
        }

        for (let i = game.lasers.length - 1; i >= 0; i--) {
          const l = game.lasers[i];
          l.life -= dt;
          if (l.life <= 0) game.lasers.splice(i, 1);
        }

        for (const e of game.enemies) {
          e.t += activeDt;

          if (e.phase === "enter") {
            e.x += (e.tx - e.x) * Math.min(1, activeDt * 2.6);
            e.y += (e.ty - e.y) * Math.min(1, activeDt * 2.6);
            if (Math.abs(e.tx - e.x) < 2 && Math.abs(e.ty - e.y) < 2) {
              e.phase = "hold";
            }
          } else {
            if (e.pattern === "sway") {
              e.x = e.tx + Math.sin(e.t * 1.2 + e.id) * 28;
            } else if (e.pattern === "zigzag") {
              e.x = e.tx + Math.sin(e.t * 2.2 + e.id) * 36;
              e.y = e.ty + Math.sin(e.t * 1.4 + e.id) * 10;
            } else if (e.pattern === "dip") {
              e.x = e.tx + Math.sin(e.t + e.id) * 18;
              e.y = e.ty + Math.max(0, Math.sin(e.t * 0.9 + e.id * 0.5)) * 22;
            } else if (e.pattern === "curve") {
              e.x = e.tx + Math.sin(e.t * 1.6 + e.id) * 24;
              e.y = e.ty + Math.cos(e.t * 1.25 + e.id) * 12;
            }
          }

          if (p.alive && rectsOverlap(p.x, p.y, 34, 42, e.x, e.y, e.w, e.h)) {
            playerHit(true);
          }

          e.fireCooldown -= activeDt;

          if (e.fireCooldown <= 0 && p.alive && e.phase !== "enter") {
            const dx = p.x - e.x;
            const dy = p.y - e.y;
            const len = Math.hypot(dx, dy) || 1;
            const spd = 150 + game.wave * 5;
            const type = Math.random() < 0.08 ? "spread" : "normal";

            if (type === "spread") {
              for (let a = -0.15; a <= 0.15; a += 0.15) {
                const vx = (dx / len) * spd;
                const vy = (dy / len) * spd;
                const cos = Math.cos(a), sin = Math.sin(a);
                game.enemyBullets.push({
                  x: e.x,
                  y: e.y + 12,
                  vx: vx * cos - vy * sin,
                  vy: vx * sin + vy * cos,
                  r: 5,
                  dmg: e.dmg,
                  color: "#ff8b8b"
                });
              }
            } else {
              game.enemyBullets.push({
                x: e.x,
                y: e.y + 12,
                vx: (dx / len) * spd,
                vy: (dy / len) * spd,
                r: 5,
                dmg: e.dmg,
                color: "#ff8b8b"
              });
            }

            e.fireCooldown = rand(e.fireBase * 0.95, e.fireBase * 1.65);
          }
        }

        if (game.boss) {
          const b = game.boss;
          b.t += activeDt;

          if (b.phase === "enter") {
            b.x += (b.tx - b.x) * Math.min(1, activeDt * 2.4);
            b.y += (b.ty - b.y) * Math.min(1, activeDt * 2.1);
            if (Math.abs(b.tx - b.x) < 2 && Math.abs(b.ty - b.y) < 2) b.phase = "fight";
          } else {
            b.x = W * 0.5 + Math.sin(b.t * 0.8) * Math.min(220, 90 + b.wave * 2);
            b.y = 145 + Math.sin(b.t * 1.15) * 18;

            if (p.alive && rectsOverlap(p.x, p.y, 34, 42, b.x, b.y, b.w, b.h)) {
              playerHit(true);
            }

            b.fireCooldown -= activeDt;
            b.volleyCooldown -= activeDt;
            b.ringCooldown -= activeDt;
            b.summonCooldown -= activeDt;

            if (b.fireCooldown <= 0) {
              const dx = p.x - b.x;
              const dy = p.y - b.y;
              const len = Math.hypot(dx, dy) || 1;
              const spd = 180 + b.wave * 4;
              game.enemyBullets.push({
                x: b.x,
                y: b.y + 20,
                vx: (dx / len) * spd,
                vy: (dy / len) * spd,
                r: 7,
                dmg: b.dmg,
                color: "#ff6f6f"
              });
              b.fireCooldown = Math.max(0.9, 1.45 - b.wave * 0.01);
            }

            if (b.volleyCooldown <= 0) {
              for (let i = -2; i <= 2; i++) {
                game.enemyBullets.push({
                  x: b.x + i * 22,
                  y: b.y + 10,
                  vx: i * 24,
                  vy: 185 + b.wave * 4,
                  r: 6,
                  dmg: b.dmg,
                  color: "#ffa0a0"
                });
              }
              b.volleyCooldown = Math.max(2.0, 3.3 - b.wave * 0.015);
            }

            if (b.ringCooldown <= 0) {
              const bullets = Math.min(16, 8 + Math.floor(b.wave / 3));
              for (let i = 0; i < bullets; i++) {
                const ang = (Math.PI * 2 * i) / bullets + b.t * 0.35;
                const spd = 105 + b.wave * 3;
                game.enemyBullets.push({
                  x: b.x,
                  y: b.y,
                  vx: Math.cos(ang) * spd,
                  vy: Math.sin(ang) * spd,
                  r: 5.5,
                  dmg: b.dmg,
                  color: "#ffd0d0"
                });
              }
              b.ringCooldown = Math.max(3.6, 5.8 - b.wave * 0.02);
            }

            if (b.summonCooldown <= 0 && game.enemies.length < 6) {
              const n = 1 + Math.floor(b.wave / 20);
              for (let i = 0; i < n; i++) {
                const tx = rand(W * 0.15, W * 0.85);
                const ty = rand(90, 240);
                game.enemies.push({
                  id: Date.now() + Math.random(),
                  x: tx + rand(-100, 100),
                  y: -60 - i * 20,
                  tx, ty,
                  w: 30, h: 28,
                  hp: 8 + Math.floor(b.wave * 0.8),
                  maxHp: 8 + Math.floor(b.wave * 0.8),
                  dmg: 1 + Math.floor(b.wave / 10),
                  fireCooldown: rand(1.8, 3.2),
                  fireBase: Math.max(1.5, 2.6 - b.wave * 0.015),
                  pattern: ["sway", "zigzag", "curve"][Math.floor(Math.random() * 3)],
                  t: Math.random() * 5,
                  phase: "enter"
                });
              }
              b.summonCooldown = Math.max(5.8, 7.2 - b.wave * 0.02);
            }
          }
        }

        for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
          const b = game.enemyBullets[i];
          b.x += b.vx * activeDt;
          b.y += b.vy * activeDt;

          if (b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) {
            game.enemyBullets.splice(i, 1);
            continue;
          }

          if (p.alive && rectCircleHit(b.x, b.y, b.r, p.x, p.y, 34, 42)) {
            game.enemyBullets.splice(i, 1);
            playerHit(false);
          }
        }

        for (let i = game.items.length - 1; i >= 0; i--) {
          const it = game.items[i];
          it.y += it.vy * activeDt;
          it.x += Math.sin(game.time * 3 + i) * 25 * activeDt;

          if (it.y > H + 30) {
            game.items.splice(i, 1);
            continue;
          }

          const dx = it.x - p.x;
          const dy = it.y - p.y;
          if (dx * dx + dy * dy < (it.r + 24) * (it.r + 24)) {
            applyItem(it.type);
            game.items.splice(i, 1);
          }
        }

        for (let i = game.particles.length - 1; i >= 0; i--) {
          const pa = game.particles[i];
          pa.life -= activeDt;
          pa.x += pa.vx * activeDt;
          pa.y += pa.vy * activeDt;
          pa.vx *= 0.98;
          pa.vy *= 0.98;
          if (pa.life <= 0) game.particles.splice(i, 1);
        }

        if (!game.boss && game.enemies.length === 0) {
          game.nextWaveDelay -= activeDt;
          if (game.nextWaveDelay <= 0) {
            game.wave += 1;
            game.waveSpawned = false;
            game.nextWaveDelay = 1.4;
            hudState.textContent = `다음 WAVE ${game.wave}`;
          }
        }
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#151a22";
      ctx.fillRect(0, 0, W, H);

      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#1d212a");
      g.addColorStop(0.45, "#242d3d");
      g.addColorStop(1, "#0f141d");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "rgba(255,130,90,0.05)";
      ctx.beginPath();
      ctx.arc(W * 0.5, H * 1.05, Math.min(W, H) * 0.34, 0, Math.PI * 2);
      ctx.fill();

      for (const s of game.stars) {
        ctx.globalAlpha = s.a;
        ctx.fillStyle = "#dce7ff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (game.hitFlash > 0) {
        ctx.globalAlpha = Math.min(0.45, game.hitFlash * 2.2);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
    }

    function drawShip(x, y, scale = 1, main = false, blink = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      if (blink) {
        ctx.globalAlpha = 0.45 + Math.sin(performance.now() * 0.02) * 0.25;
      }

      ctx.fillStyle = main ? "#e8eef9" : "#c8d5e9";
      ctx.strokeStyle = "#2e3444";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(18, 22);
      ctx.lineTo(0, 14);
      ctx.lineTo(-18, 22);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = main ? "#aab7cd" : "#9fb0c8";
      ctx.beginPath();
      ctx.moveTo(-26, 10);
      ctx.lineTo(-8, 2);
      ctx.lineTo(-8, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(26, 10);
      ctx.lineTo(8, 2);
      ctx.lineTo(8, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#7fc4ff";
      ctx.fillRect(-4, -14, 8, 12);
      ctx.strokeRect(-4, -14, 8, 12);

      ctx.fillStyle = "#ffcd62";
      ctx.beginPath();
      ctx.arc(0, -27, 5, 0, Math.PI * 2);
      ctx.fill();

      const t = performance.now() * 0.04;
      ctx.strokeStyle = "rgba(255,240,220,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -31);
      ctx.lineTo(Math.cos(t) * 12, -31 + Math.sin(t) * 4);
      ctx.moveTo(0, -31);
      ctx.lineTo(Math.cos(t + Math.PI / 2) * 12, -31 + Math.sin(t + Math.PI / 2) * 4);
      ctx.stroke();

      ctx.restore();
    }

    function drawMiniShip(x, y, lv) {
      ctx.save();
      ctx.translate(x, y);
      drawShip(0, 0, 0.55 + Math.min(0.18, lv * 0.03), false);
      ctx.restore();
    }

    function drawPlayer() {
      const p = game.player;
      if (!p) return;

      ctx.save();
      ctx.translate(p.x, p.y);

      if (!p.alive) ctx.globalAlpha = 0.25;

      if (p.miniLevel > 0) {
        drawMiniShip(-30, 8, p.miniLevel);
        drawMiniShip(30, 8, p.miniLevel);
      }

      drawShip(0, 0, 1, true, p.invincible > 0);
      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = "#d86060";
      ctx.strokeStyle = "#632626";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, 16);
      ctx.lineTo(18, -10);
      ctx.lineTo(9, -4);
      ctx.lineTo(0, -18);
      ctx.lineTo(-9, -4);
      ctx.lineTo(-18, -10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffd1d1";
      ctx.fillRect(-3, -4, 6, 8);
      ctx.restore();

      drawHpBar(e.x, e.y - 24, 34, 5, e.hp / e.maxHp, "#ff7e7e");
    }

    function drawBoss(b) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.fillStyle = "#8f3030";
      ctx.strokeStyle = "#3d1111";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.roundRect(-80, -44, 160, 88, 24);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#bc4f4f";
      ctx.beginPath();
      ctx.moveTo(-120, 10);
      ctx.lineTo(-55, -8);
      ctx.lineTo(-55, 26);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(120, 10);
      ctx.lineTo(55, -8);
      ctx.lineTo(55, 26);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffd5d5";
      ctx.fillRect(-10, -16, 20, 18);
      ctx.fillStyle = "#ff9b9b";
      ctx.fillRect(-42, 6, 84, 10);
      ctx.restore();

      drawHpBar(W * 0.5, 28, Math.min(420, W * 0.7), 14, b.hp / b.maxHp, "#ff6262", true, `BOSS HP ${Math.max(0, Math.ceil(b.hp))}`);
    }

    function drawHpBar(x, y, w, h, ratio, color, center = true, label = "") {
      const left = center ? x - w / 2 : x;
      ctx.fillStyle = "rgba(0,0,0,0.42)";
      ctx.fillRect(left, y, w, h);
      ctx.fillStyle = color;
      ctx.fillRect(left, y, Math.max(0, w * ratio), h);
      ctx.strokeStyle = "rgba(255,255,255,0.15)";
      ctx.strokeRect(left, y, w, h);
      if (label) {
        ctx.fillStyle = "#f7fbff";
        ctx.font = "bold 13px Malgun Gothic";
        ctx.textAlign = "center";
        ctx.fillText(label, x, y - 6);
        ctx.textAlign = "left";
      }
    }

    function drawItem(it) {
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.type === "power") ctx.fillStyle = "#ffd86a";
      else if (it.type === "upgrade") ctx.fillStyle = "#7ecbff";
      else ctx.fillStyle = "#ff79f0";

      ctx.beginPath();
      ctx.arc(0, 0, it.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#1b1b1b";
      ctx.font = "bold 12px Malgun Gothic";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(it.type === "power" ? "P" : it.type === "upgrade" ? "U" : "S", 0, 1);
      ctx.restore();
    }

    function drawLaserTrail(l) {
      const alpha = Math.max(0, l.life / l.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha * 0.85;

      ctx.fillStyle = l.colorMain;
      ctx.fillRect(l.x - l.width / 2, l.y - l.height / 2, l.width, l.height);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = l.colorCore;
      ctx.fillRect(l.x - (l.width * 0.38) / 2, l.y - l.height / 2, l.width * 0.38, l.height);

      ctx.restore();
    }

    function draw() {
      let shakeX = 0, shakeY = 0;
      if (game.shake > 0) {
        shakeX = rand(-5, 5) * game.shake;
        shakeY = rand(-5, 5) * game.shake;
      }

      ctx.save();
      ctx.translate(shakeX, shakeY);
      drawBackground();

      for (const l of game.lasers) drawLaserTrail(l);

      for (const b of game.bullets) {
        ctx.save();
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = b.colorMain;
        ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
        ctx.fillStyle = b.colorCore;
        ctx.fillRect(b.x - (b.width * 0.38) / 2, b.y - b.height / 2, b.width * 0.38, b.height);
        ctx.restore();
      }

      for (const b of game.enemyBullets) {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const e of game.enemies) drawEnemy(e);
      if (game.boss) drawBoss(game.boss);
      for (const it of game.items) drawItem(it);
      drawPlayer();

      for (const pa of game.particles) {
        ctx.globalAlpha = Math.max(0, pa.life / pa.maxLife);
        ctx.fillStyle = pa.color;
        ctx.beginPath();
        ctx.arc(pa.x, pa.y, pa.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      ctx.fillStyle = "rgba(10,12,18,0.55)";
      ctx.fillRect(12, H - 104, 290, 88);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.strokeRect(12, H - 104, 290, 88);
      ctx.fillStyle = "#f2f7ff";
      ctx.font = "bold 16px Malgun Gothic";
      ctx.fillText(`WAVE ${Math.max(1, game.wave)}`, 24, H - 72);
      ctx.fillText(`점수 ${game.score}`, 24, H - 48);
      ctx.fillText(`골드 ${playerProfile?.gold || 0}`, 24, H - 24);
      ctx.font = "14px Malgun Gothic";

      const p = game.player;
      if (p) {
        ctx.fillText(`레벨 ${p.level}  공격력 ${p.dmg}  탄수 ${p.bulletCount}`, 160, H - 24);
      }

      if (game.messageTimer > 0 && game.message) {
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(W * 0.5 - 160, 54, 320, 46);
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.strokeRect(W * 0.5 - 160, 54, 320, 46);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 26px Malgun Gothic";
        ctx.textAlign = "center";
        ctx.fillText(game.message, W * 0.5, 85);
        ctx.textAlign = "left";
      }

      if (!game.touchDown && game.player?.alive) {
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#f1f6ff";
        ctx.font = "bold 28px Malgun Gothic";
        ctx.textAlign = "center";
        ctx.fillText("누르고 있는 동안만 시간이 흐릅니다", W * 0.5, H * 0.5 - 12);
        ctx.font = "16px Malgun Gothic";
        ctx.fillText("손/마우스로 드래그해 비행기를 움직여", W * 0.5, H * 0.5 + 22);
        ctx.textAlign = "left";
      }
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      const activeDt = game.touchDown ? dt : 0;
      update(dt, activeDt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
